<!DOCTYPE html>
<html>

<head>
    <title>Movique Dashboard</title>

    <style>
        body {
            background-color: #141414;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background-color: #000;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #e50914;
        }

        .container {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: #1f1f1f;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .movie-card img {
            width: 100%;
            border-radius: 10px;
        }

        button {
            margin-top: 10px;
            padding: 8px;
            background: #e50914;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <script>
        const BASE_URL = "http://127.0.0.1:5000";

        const user = localStorage.getItem("user");
        const token = localStorage.getItem("token");

        if (!user || !token) {
            window.location.href = "login.html";
        }
    </script>

    <!-- NAV -->
    <div class="navbar">
        <div class="logo">🎬 Movique</div>
        <div>
            👋 <span id="username"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="container">

        <h2>Movies 🎬</h2>
        <div id="movieList" class="grid"></div>

        <h2>Watchlist ⭐</h2>
        <div id="watchlist" class="grid"></div>

    </div>

    <script>

        document.getElementById("username").innerText = user;


        // =========================
        // SAFE FETCH (IMPORTANT FIX)
        // =========================
        async function fetchAPI(url, options = {}) {
            try {
                const res = await fetch(BASE_URL + url, {
                    ...options,
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    }
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || "Server Error");
                }

                return data;

            } catch (err) {
                console.error("API ERROR:", err.message);
                throw err;
            }
        }


        // =========================
        // LOAD MOVIES
        // =========================
        async function loadMovies() {
            try {
                const data = await fetchAPI("/api/movies");

                const container = document.getElementById("movieList");
                container.innerHTML = "";

                data.forEach(movie => {
                    container.innerHTML += `
                <div class="movie-card">
                    <img src="${movie.poster || ''}">
                    <h3>${movie.title}</h3>
                    <p>${movie.genre} (${movie.year})</p>

                    <button onclick="addToWatchlist(${movie.id})">
                        ⭐ Add to Watchlist
                    </button>
                </div>
            `;
                });

            } catch (err) {
                alert("Movies not loading ❌ Check backend / login / token");
            }
        }


        // =========================
        // ADD
        // =========================
        async function addToWatchlist(movieId) {
            try {
                await fetchAPI("/api/watchlist/add", {
                    method: "POST",
                    body: JSON.stringify({ movie_id: movieId })
                });

                loadWatchlist();

            } catch (err) {
                alert(err.message);
            }
        }


        // =========================
        // LOAD WATCHLIST
        // =========================
        async function loadWatchlist() {
            try {
                const data = await fetchAPI("/api/watchlist");

                const container = document.getElementById("watchlist");
                container.innerHTML = "";

                data.forEach(movie => {
                    container.innerHTML += `
                <div class="movie-card">
                    <img src="${movie.poster || ''}">
                    <h3>${movie.title}</h3>
                    <p>${movie.genre} (${movie.year})</p>

                    <button onclick="removeFromWatchlist(${movie.movie_id})">
                        ❌ Remove
                    </button>
                </div>
            `;
                });

            } catch (err) {
                alert("Watchlist not loading ❌ Check backend / DB / auth");
            }
        }


        // =========================
        // REMOVE
        // =========================
        async function removeFromWatchlist(movieId) {
            try {
                await fetchAPI(`/api/watchlist/remove/${movieId}`, {
                    method: "DELETE"
                });

                loadWatchlist();

            } catch (err) {
                alert(err.message);
            }
        }


        // =========================
        // LOGOUT
        // =========================
        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }


        // INIT
        loadMovies();
        loadWatchlist();

    </script>

</body>

</html>
