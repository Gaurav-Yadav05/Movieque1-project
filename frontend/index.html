<!DOCTYPE html>
<html>

<head>
  <title>Movique</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #141414;
      color: white;
      text-align: center;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 15px 30px;
      background-color: #000;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #e50914;
      }

    .nav-links a {
      margin-left: 15px;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-links a:hover {
      color: #e50914;
    }

    /* Hero Section */
    .hero {
      margin-top: 100px;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      color: #aaa;
    }

    .buttons {
      margin-top: 30px;
    }

    .buttons a {
      padding: 10px 20px;
      margin: 10px;
      background-color: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .buttons a:hover {
      background-color: #ff1e2d;
    }
  </style>
</head>

<body>

  <!-- ✅ Navbar -->
  <div class="navbar">
    <div class="logo">🎬 Movique</div>

    <div class="nav-links">
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </div>
  </div>

  <!-- ✅ Hero Section -->
  <div class="hero">
    <h1>Unlimited Movies 🎥</h1>
    <p>Track, Review & Discover your favorite films</p>

    <div class="buttons">
      <a href="login.html">Get Started</a>
      <a href="register.html">Create Account</a>
    </div>
  </div>

</body>

</html>
