<!DOCTYPE html>
<html>

<head>
  <title>Login - Movique</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* 🌌 BACKGROUND SLIDESHOW */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      height: 100vh;
      overflow: hidden;
    }

    .bg-slide {
      position: fixed;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: -1;
    }

    .bg-slide.active {
      opacity: 1;
    }

    /* 🧊 GLASS LOGIN BOX */
    .form-container {
      margin-top: 120px;
      display: inline-block;
      padding: 30px;
      border-radius: 15px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      margin-top: 80px;
    }

    input {
      padding: 10px;
      margin: 10px;
      width: 250px;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px 20px;
      background-color: #e50914;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #ff1e2d;
    }

    a {
      color: #e50914;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <!-- 🌌 BACKGROUND IMAGES -->
  <div class="bg-slide active"
    style="background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee')"></div>
  <div class="bg-slide" style="background-image:url('https://images.unsplash.com/photo-1446776811953-b23d57bd21aa')">
  </div>
  <div class="bg-slide" style="background-image:url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564')">
  </div>

  <h2>Welcome Back 🎬</h2>

  <div class="form-container">
    <input type="text" id="username" placeholder="Enter username"><br>
    <input type="password" id="password" placeholder="Enter password"><br>

    <button onclick="login()">Login</button>
  </div>

  <p>Don't have an account? <a href="register.html">Register here</a></p>

  <script>
    // 🌌 BACKGROUND SLIDER
    let slides = document.querySelectorAll(".bg-slide");
    let index = 0;

    setInterval(() => {
      slides[index].classList.remove("active");
      index = (index + 1) % slides.length;
      slides[index].classList.add("active");
    }, 4000);
  </script>

  <script>
    async function login() {
      console.log("LOGIN BUTTON CLICKED");

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("Please fill all fields ❌");
        return;
      }

      try {
        console.log("CALLING API...");

        const res = await fetch("http://127.0.0.1:5000/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        console.log("STATUS:", res.status);

        if (!res.ok) {
          const text = await res.text();
          console.error("Server error response:", text);
          alert("Server error ❌ (Check backend terminal)");
          return;
        }

        const data = await res.json();
        console.log("LOGIN RESPONSE:", data);

        if (!data.token) {
          alert("Invalid Credentials ❌");
          return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", data.user?.username || username);

        alert("Login successful ✅");

        window.location.href = "dashboard.html";

      } catch (err) {
        console.error("FETCH ERROR:", err);
        alert("Cannot connect to server ❌ (Is backend running?)");
      }
    }
  </script>

</body>

</html>
